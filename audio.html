      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">

      <div class="d-flex gap-2 align-items-center">
        <button class="btn btn-outline-gold" id="btnFavModal" type="button" title="المفضلة">
          <i class="fa-solid fa-heart"></i>
        </button>
        <button class="btn btn-outline-gold" data-theme-toggle type="button" title="تبديل الوضع">

<header class="container container-narrow my-4">
  <div class="hero">
    <h1 class="mb-2" style="font-family:Amiri,serif;">بحث الصوتيات MP3</h1>
    <p class="mb-0" style="opacity:.92">
      اكتب كلماتك (مثلاً: "العقيدة والتوحيد" أو اسم الشيخ). يتم تطبيق تطبيع عربي لزيادة دقة النتائج.
    </p>
  </div>
</header>

<main class="container container-narrow mb-5 pb-5">
  <section class="cardx">
    <div class="cardx-body">
      <form id="searchForm" class="row g-2 align-items-center" role="search">
        <div class="col-12 col-md-9">
          <input id="q" class="form-control" type="search" placeholder="ابحث عن: شيخ، كتاب مسموع، درس..." aria-label="بحث الصوتيات">
        </div>
        <div class="col-12 col-md-3 d-grid">
          <button class="btn btn-gold" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i> بحث
          </button>
        </div>
      </form>

      <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-outline-gold btn-sm" type="button" data-preset="الشيخ صالح بن فوزان الفوزان">
          مثال: الشيخ صالح بن فوزان الفوزان
        </button>
        <button class="btn btn-outline-gold btn-sm" type="button" data-preset="العقيدة والتوحيد">
          مثال: العقيدة والتوحيد
        </button>
      </div>

      <div class="mt-3" id="status"></div>

      <div class="loader-wrap mt-3" id="loaderWrap" aria-live="polite">
        <div class="loader" title="تحميل"></div>
        <div class="text-center small-muted mt-2">جاري تحميل النتائج...</div>
      </div>
    </div>
  </section>

  <section class="mt-3" id="results" aria-live="polite"></section>

  <section class="mt-3" id="pagination"></section>
</main>

<!-- Modal: Playlist -->
<div class="modal fade" id="playlistModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content cardx">
      <div class="modal-header">
        <h5 class="modal-title" style="font-family:Amiri,serif;">قائمة المقاطع (MP3)</h5>
        <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body" id="playlistBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-gold" data-bs-dismiss="modal">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Favorites -->
<div class="modal fade" id="favoritesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable modal-lg">
    <div class="modal-content cardx">
      <div class="modal-header">
        <h5 class="modal-title" style="font-family:Amiri,serif;">المفضلة</h5>
        <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="إغلاق"></button>
      </div>
      <div class="modal-body" id="favoritesBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-gold" data-bs-dismiss="modal">إغلاق</button>
      </div>
    </div>
  </div>
</div>

<!-- Player Bar -->
<div class="player-bar" id="playerBar" role="region" aria-label="مشغل الصوت">
  <div class="container container-narrow">
    <div class="d-flex align-items-center justify-content-between gap-2">
      <div class="player-meta flex-grow-1">
        <div class="title" id="playerTitle">—</div>
        <div class="sub" id="playerSub">—</div>
      </div>

      <div class="player-controls d-flex align-items-center gap-1">
        <button id="btnPrev" title="السابق" aria-label="السابق"><i class="fa-solid fa-backward-step"></i></button>
        <button id="btnPlay" title="تشغيل/إيقاف" aria-label="تشغيل/إيقاف"><i class="fa-solid fa-play"></i></button>
        <button id="btnNext" title="التالي" aria-label="التالي"><i class="fa-solid fa-forward-step"></i></button>

        <input class="range mx-2" id="volRange" type="range" min="0" max="1" step="0.05" value="0.9" aria-label="الصوت" style="width:120px;">

        <button id="btnFav" title="مفضلة" aria-label="مفضلة"><i class="fa-solid fa-heart"></i></button>
        <button id="btnDownload" title="تحميل" aria-label="تحميل"><i class="fa-solid fa-download"></i></button>
        <button id="btnShare" title="مشاركة/نسخ رابط" aria-label="مشاركة"><i class="fa-solid fa-share-nodes"></i></button>
      </div>
    </div>

    <audio id="audioEl" preload="none"></audio>
  </div>
</div>

    </div>
  </div>
</footer>

</body>
</html>
