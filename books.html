<header class="container container-narrow my-4">
  <div class="hero">
    <h1 class="mb-2" style="font-family:Amiri,serif;">بحث الكتب PDF</h1>
    <p class="mb-0" style="opacity:.92">
      يتم عرض النتائج من Archive.org، وعند الضغط على "تحميل PDF" سيبحث الموقع داخل العنصر عن ملف PDF.
    </p>
  </div>
</header>

<main class="container container-narrow">
  <section class="cardx">
    <div class="cardx-body">
      <form id="searchForm" class="row g-2 align-items-center" role="search">
        <div class="col-12 col-md-9">
          <input id="q" class="form-control" type="search" placeholder="ابحث عن كتاب: تفسير، عقيدة، حديث..." aria-label="بحث الكتب">
        </div>
        <div class="col-12 col-md-3 d-grid">
          <button class="btn btn-gold" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i> بحث
          </button>
        </div>
      </form>

      <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-outline-gold btn-sm" type="button" data-preset="تفسير ابن كثير">
          مثال: تفسير ابن كثير
        </button>
        <button class="btn btn-outline-gold btn-sm" type="button" data-preset="شرح كتاب التوحيد">
          مثال: شرح كتاب التوحيد
        </button>
      </div>

      <div class="mt-3" id="status"></div>

      <div class="loader-wrap mt-3" id="loaderWrap" aria-live="polite">
        <div class="loader" title="تحميل"></div>
        <div class="text-center small-muted mt-2">جاري تحميل النتائج...</div>
      </div>
    </div>
  </section>

  <section class="mt-3" id="results" aria-live="polite"></section>
  <section class="mt-3 mb-5" id="pagination"></section>
</main>
